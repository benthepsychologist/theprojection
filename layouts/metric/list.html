<!doctype html>
<html lang="en">
<head>
{{ partial "head.html" . }}
<style>
  .metric-index{max-width:720px}
  .metric-index-title{font-family:var(--serif);font-size:clamp(28px,4.6vw,38px);
    font-weight:600;letter-spacing:-.01em;margin:0 0 12px}
  .metric-index-lede{font-family:var(--serif);font-size:16px;line-height:1.6;
    color:var(--ink-70);max-width:62ch}
  .metric-index-lede p{margin:0 0 12px}
  .metric-cards{list-style:none;margin:26px 0 0;padding:0;display:flex;
    flex-direction:column;gap:0;border-top:1px solid var(--hair)}
  .metric-card{border-bottom:1px solid var(--hair)}
  .metric-card a{display:flex;justify-content:space-between;align-items:baseline;
    gap:16px;padding:15px 2px;text-decoration:none;color:var(--ink)}
  .metric-card a:hover .mc-name{text-decoration:underline;text-decoration-color:var(--ink-45)}
  .mc-name{font-family:var(--serif);font-size:19px;font-weight:600}
  .mc-unit{font-family:var(--sans);font-size:12px;color:var(--ink-45);
    font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .mc-role{font-family:var(--sans);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-45);display:block;margin-top:2px}
</style>
</head>
<body>
{{ partial "masthead.html" . }}

<main class="wrap board-paper metric-index">
  <h1 class="metric-index-title">{{ .Title }}</h1>
  <div class="metric-index-lede">{{ .Content }}</div>

  <ul class="metric-cards">
    {{ range .Pages.ByWeight }}
    <li class="metric-card">
      <a href="{{ .RelPermalink }}">
        <span><span class="mc-name">{{ .Title }}</span>
          <span class="mc-role">{{ .Params.role }}</span></span>
        <span class="mc-unit">{{ .Params.unit }}</span>
      </a>
    </li>
    {{ end }}
  </ul>
</main>

{{ partial "footer.html" . }}
</body>
</html>
