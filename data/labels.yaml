# data/labels.yaml — vocabulary projections over the neutral board taxonomy.
#
# "The surface is never the system." The board (kestrel: attention/board.yaml)
# classifies every actor in NEUTRAL kinds. This file is the COSTUME — it maps
# each neutral kind to a display label + a one-line legend gloss. Swap the
# active projection to re-skin the whole board without reclassifying anyone;
# the on-page vocabulary button toggles between the projections below.
#
# Each kind carries { label, gloss }. The /map/ legend is GENERATED from
# these, so the vocabulary can never drift from the words on the page.
#
# `costumable: false` on a kind means it keeps its neutral label in EVERY
# projection — this is how "the costume ends where sovereignty begins" is
# ENFORCED by the renderer instead of remembered by a human. States carry it.
#
# TWO ENTITY KINDS carry labels: `house` (people) and the org `ranks`. The
# `house.template` is the one place a label interpolates an actor field
# rather than being a static string — feudal "House {surname}", plain "{name}"
# (surname = last token of the House's name).

default: feudal

projections:

  # ---- Projection 1: plain (neutral passthrough) --------------------------
  plain:
    label: "Plain"
    masthead: "Major actors, by structural position. People hold organizations."
    house:  { label: "People", template: "{name}", gloss: "The principal person controlling one or more organizations." }
    ranks:
      state:       { label: "State",        gloss: "Writes law rather than lobbying for it. Sovereignty is graded, not binary.", costumable: false }
      kingdom:     { label: "Organization", gloss: "An organization on the board — differentiated by capitalization, optionality, and economic gravity, not by rank." }
      regulator:   { label: "Regulator",    gloss: "Writes rules over actors it doesn't own. (Stub — a state organ, pending re-home.)" }
      route-layer: { label: "Trade Layer",  gloss: "What moves between spheres. (Stub — not an actor.)" }
    pockets:
      hyperscaler:  { label: "Hyperscalers",  gloss: "Cloud + platform giants; own the compute and the distribution." }
      frontier-lab: { label: "Frontier labs", gloss: "The model-makers — capital is raised compute money." }
      foundry:      { label: "Foundries",     gloss: "The fabs. Whoever prints the silicon." }
      chips:        { label: "Chips",         gloss: "Designers, intermediaries, and memory — the silicon layer." }
      capital:      { label: "Capital",       gloss: "Asset managers + sovereign funds; command money they don't own." }
      insurance:    { label: "Insurance",     gloss: "Long-duration capital pools; mostly constrained." }
      health:       { label: "Health",        gloss: "Payers + providers — the care economy." }
    postures:
      at-war:        { label: "contesting" }
      hedging:       { label: "hedging" }
      consolidating: { label: "consolidating" }
      expanding:     { label: "expanding" }
      retrenching:   { label: "retrenching" }
      dormant:       { label: "dormant" }
    conditions:
      in-succession: { label: "in succession" }
      under-review:  { label: "under regulatory review" }
    genres:
      succession:         { label: "succession" }
      border-war:         { label: "border dispute" }
      partnership:        { label: "partnership" }
      authority-claim:    { label: "authority claim" }
      labor-action:       { label: "labor action" }
      legitimacy-dispute: { label: "legitimacy dispute" }
      hedge:              { label: "hedge" }
      capital-flow:       { label: "capital flow" }
      buildout-race:      { label: "buildout race" }
      scarcity:           { label: "scarcity" }
      exogenous-shock:    { label: "exogenous shock" }
      coalition:          { label: "coalition" }
      resource-move:      { label: "resource move" }
      financing:          { label: "financing" }

  # ---- Projection 2: feudal (the costume) ---------------------------------
  feudal:
    label: "The Map"
    masthead: "The costume ends where sovereignty begins."
    house:  { label: "Houses", template: "House {surname}", gloss: "A person who holds one or more realms. Succession is tracked; a realm can change Houses." }
    ranks:
      state:       { label: "State",   gloss: "A legal monopoly on force. No House, no ruler — the asymmetry is the point. Sovereignty is graded.", costumable: false }
      kingdom:     { label: "Kingdom", gloss: "A realm held by a House. Its weight is its treasury (capitalization), the freedom of its coin (optionality), and the economy in its orbit (gravity) — not a fixed rung." }
      regulator:   { label: "The Church", gloss: "Claimed moral jurisdiction over actors it doesn't own. (Stub — belongs to a State, pending re-home.)" }
      route-layer: { label: "The Silk Road", gloss: "The road between the apex spheres, and what moves on it. (Stub — not an actor.)" }
    pockets:
      hyperscaler:  { label: "The Great Powers", gloss: "They own the compute and the roads; the rest pay to pass." }
      frontier-lab: { label: "The Sorcerers",     gloss: "Conjurers of models; their treasuries are borrowed spellpower." }
      foundry:      { label: "The Foundries",     gloss: "Where the silicon is cast. Few, and irreplaceable." }
      chips:        { label: "The Forges",        gloss: "Smiths of the war material — designers, brokers, and the memory guilds." }
      capital:      { label: "The Treasuries",    gloss: "Moneylenders and sovereign coffers; they direct coin they do not own." }
      insurance:    { label: "The Underwriters",  gloss: "Vast, slow vaults of pledged coin, bound by covenant." }
      health:       { label: "The Infirmaries",   gloss: "Those who hold the gates to care — and the purse for it." }
    postures:
      at-war:        { label: "at war" }
      hedging:       { label: "hedging" }
      consolidating: { label: "consolidating" }
      expanding:     { label: "expanding" }
      retrenching:   { label: "retrenching" }
      dormant:       { label: "dormant" }
    conditions:
      in-succession: { label: "in succession" }
      under-review:  { label: "under interdict" }
    genres:
      succession:         { label: "succession" }
      border-war:         { label: "border war" }
      partnership:        { label: "marriage alliance" }
      authority-claim:    { label: "investiture" }
      labor-action:       { label: "revolt" }
      legitimacy-dispute: { label: "heresy trial" }
      hedge:              { label: "hedge" }
      capital-flow:       { label: "tribute" }
      buildout-race:      { label: "siege" }
      scarcity:           { label: "famine" }
      exogenous-shock:    { label: "act of god" }
      coalition:          { label: "confederation" }
      resource-move:      { label: "mines" }
      financing:          { label: "treasury" }
