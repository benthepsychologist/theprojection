baseURL: "https://theprojection.org"
languageCode: "en-us"
title: "The Projection"

outputs:
  home: ["HTML", "RSS"]
  section: ["HTML", "RSS"]
  page: ["HTML"]

enableRobotsTXT: true
disableKinds: ["taxonomy", "term"]

markup:
  goldmark:
    renderer:
      unsafe: false

params:
  tagline: "The surface is never the system."
  description: >
    Inference economics, governed infrastructure, and epistemics — read
    through a clinical psychologist who builds software. Published from
    kestrel, Ben's personal intelligence layer.
  favicon: "/favicon.png"
  mark: "/images/mark.png"

  lenses:
    ai:
      label: "AI"
      color: "#0070E0"
    global-capital:   # renamed from "money" 2026-07-30 (Ben, full rename)
      label: "Global Capital"
      color: "#A86302"
    mental-health:
      label: "Mental Health"
      color: "#E50B1E"

menus:
  # Project-level nav (Ben, 2026-08-03): the front page is the projects hub;
  # the top nav mirrors it. The three lens beats now live under /news/ (as
  # /news/ai/ etc.) and are reached from there; threads and entities are
  # shared news/map infrastructure reachable from the pages that use them.
  main:
    - name: "News"
      url: "/news/"
      weight: 1
    - name: "The Map"
      url: "/map/"
      weight: 2
    - name: "Research"
      url: "/research/"
      weight: 3
    - name: "About"
      url: "/about/"
      weight: 4
